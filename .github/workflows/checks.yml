name: checks

# Reusable: ci.yml runs it on PRs, release.yml before publishing a tag or a develop image.
# 001-AC29: lint, Go tests with PG, web tests, e2e and image build on every PR.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web format:check
      # 001-AC30: web/src/api/schema.gen.ts matches api/openapi.json (the Go drift test covers the other side).
      - run: pnpm --dir web check:api
      - run: scripts/check-release-pin.sh --self-test

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # testcontainers starts postgres:18-alpine on the runner's Docker; coverage gate fails below 80 %.
      - run: make go-coverage
      # The race detector allocates more, and the rule-set bound and the whole property test take minutes under it.
      - run: go test -v -count=1 -run 'TestWorstCaseTiming|TestRuleSetBound|TestCostModelProperty|TestParseNotesAllocations' ./pkg/filter ./pkg/collect
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        continue-on-error: true
        run: go tool cover -func=coverage.out | awk '/^total:/ { print "**Go coverage:** " $3 }' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-coverage
          path: coverage.out

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-coverage
      - name: Coverage summary
        if: always() && hashFiles('web/coverage/coverage-summary.json') != ''
        continue-on-error: true
        run: |
          node -e 'const t = require("./web/coverage/coverage-summary.json").total;
            const k = ["statements", "branches", "functions", "lines"];
            console.log("**Web coverage**\n\n| " + k.join(" | ") + " |\n|" + " --- |".repeat(k.length) + "\n| " + k.map((x) => t[x].pct + "%").join(" | ") + " |");' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-coverage
          path: web/coverage

  e2e:
    runs-on: ubuntu-latest
    # Keycloak pull + start adds a few minutes; its own wait is bounded in scripts/e2e.sh.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            bin/e2e-server.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=v0.0.0
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.ts }}
            PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

  # 001-AC28: kind deploy of deploy/k8s (2 web + 2 worker, sandbox, watch run) and compose dev mode.
  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Version pinned; the Go checksum database verifies the module.
      - run: go install sigs.k8s.io/kind@v0.33.0
      # use: false keeps the default builder for the smoke's own `docker compose up --build`.
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
      - id: meta
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # gedour:local from the docker job's cache, instead of `make docker-build` from scratch.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          load: true
          tags: gedour:local
          build-args: |
            VERSION=v0.0.0
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.ts }}
            PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=linux-amd64
      - run: scripts/k8s-smoke.sh
