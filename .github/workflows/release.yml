name: release

# Tags publish releases; every push to develop publishes develop-<sha>-<run>, which Flux image automation can follow.
on:
  push:
    branches: [develop]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gedour/gedour

# A run in progress is never cancelled (no half-published image); a queued one is superseded by a newer push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A develop merge of a PR branch that already held develop has the PR head's exact tree, and ci.yml tested
  # that tree (its merge ref was the head itself): a green ci.yml run on the head stands for the checks.
  tested:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      head: ${{ steps.find.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse --verify --quiet HEAD^2) || exit 0
          git merge-base --is-ancestor HEAD^1 "$head" || exit 0
          # An API failure runs the full checks rather than failing the release.
          if ! runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${head}&status=success" -q .total_count); then
            echo "::warning::ci.yml runs lookup failed; running the checks"
            exit 0
          fi
          if (( runs > 0 )); then
            echo "head=${head}" >> "$GITHUB_OUTPUT"
            echo "Checks skipped: ci.yml passed on ${head}, same tree." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The commit passes the full CI gate before anything is pushed, unless tested found it already did.
  checks:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.head == '' }}
    uses: ./.github/workflows/checks.yml

  # A release tag must match the image tag pinned in deploy/k8s/base and the README overlay example.
  pin:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-release-pin.sh "${GITHUB_REF_NAME}"

  build:
    needs: [tested, checks, pin]
    # pin is skipped on develop: run when checks passed (or tested vouched for them) and pin passed or did not apply.
    if: >-
      ${{ !cancelled()
        && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.tested.outputs.head != ''))
        && contains(fromJSON('["success","skipped"]'), needs.pin.result) }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: vars
        run: |
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('develop-{0}-{1}', steps.vars.outputs.sha, github.run_number) }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.vars.outputs.ts }}
            PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.vars.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.slug }}
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.vars.outputs.slug }}
          path: digests/*
          retention-days: 1

  merge:
    needs: build
    # Without it, the pin job skipped on develop would skip this one too (skips propagate past build's own if).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            # type=semver emits a pre-release as its v-less version whatever the pattern: the git tag is the version.
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=match,pattern=v\d+\.\d+\.\d+-(alpha|beta|rc),group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=develop-{{sha}}-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/develop' }}
      # Each per-platform push is an OCI index (image + attestations): only imagetools can merge those.
      - working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - name: Sign the merged index
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${digest}"
        env:
          # meta's version is the highest-priority tag (0.1 for v0.1.0), a moving tag another run may retarget.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.version }}
