repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # A patch's blank context lines are a single space: stripping it changes the pnpm patch hash.
        exclude: ^web/patches/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Local hooks run the toolchain already pinned in go.mod / web/package.json, so pre-commit and CI agree.
  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: gofmt + goimports (golangci-lint fmt)
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm --dir web exec prettier --write .
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm --dir web lint
        language: system
        files: ^web/.*\.(ts|tsx|js)$
        pass_filenames: false
