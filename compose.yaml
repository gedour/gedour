services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gedour
      POSTGRES_USER: gedour
      POSTGRES_PASSWORD: gedour
    ports:
      # Loopback only; e2e and local `go run` reach it here. Override when 55432 is taken.
      - "127.0.0.1:${GEDOUR_DB_PORT:-55432}:5432"
    volumes:
      # postgres 18 images keep PGDATA under a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gedour -d gedour"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev single-user mode: no login, every request runs as dev@local.
  gedour:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEDOUR_DATABASE_URL: postgres://gedour:gedour@db:5432/gedour?sslmode=disable
      GEDOUR_LOG_FORMAT: console
      GEDOUR_DEV_USER: dev@local
      # Dev-only key, public in this file: never reuse it where real credentials are stored.
      GEDOUR_ENCRYPTION_KEY: ZGV2LW9ubHktZ2Vkb3VyLWtleS0zMi1ieXRlcy0hISE=
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

  # `--profile oidc`: Keycloak with the test realm (alice/alice, bob/bob), and gedour on :8082 signing in through it.
  keycloak:
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:26.8.1
    # Same port inside and out: the issuer URL (http://localhost:<port>/...) must read the same to the browser and to gedour.
    command: ["start-dev", "--import-realm", "--http-port=${GEDOUR_KC_PORT:-8081}", "--health-enabled=true"]
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:${GEDOUR_KC_PORT:-8081}:${GEDOUR_KC_PORT:-8081}"
      # gedour-oidc shares this network namespace, so its port is published here.
      - "127.0.0.1:${GEDOUR_OIDC_PORT:-8082}:8082"
    healthcheck:
      # No curl in the image: raw HTTP on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  gedour-oidc:
    profiles: [oidc]
    build: .
    # Keycloak's namespace: http://localhost:<kc port> is Keycloak for gedour as it is for the browser.
    network_mode: service:keycloak
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      GEDOUR_DATABASE_URL: postgres://gedour:gedour@db:5432/gedour?sslmode=disable
      GEDOUR_LOG_FORMAT: console
      GEDOUR_HTTP_ADDR: ":8082"
      GEDOUR_METRICS_ADDR: ":9092"
      GEDOUR_PUBLIC_URL: http://localhost:${GEDOUR_OIDC_PORT:-8082}
      OIDC_ISSUER: http://localhost:${GEDOUR_KC_PORT:-8081}/realms/gedour-test
      OIDC_CLIENT_ID: gedour
      # Test-realm secret from deploy/keycloak/realm.json, not a real one.
      OIDC_CLIENT_SECRET: gedour-test-secret
      # Dev-only key, public in this file: never reuse it where real credentials are stored.
      GEDOUR_ENCRYPTION_KEY: ZGV2LW9ubHktZ2Vkb3VyLWtleS0zMi1ieXRlcy0hISE=

volumes:
  pgdata:
