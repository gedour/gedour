apiVersion: apps/v1
kind: Deployment
metadata:
  name: gedour-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # GEDOUR_SHUTDOWN_TIMEOUT 15 s to drain runs and deliveries, with margin.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gedour
              app.kubernetes.io/component: worker
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: gedour
          image: ghcr.io/gedour/gedour
          args: ["--role=worker"]
          envFrom:
            - configMapRef:
                name: gedour
            - secretRef:
                name: gedour
          ports:
            - name: metrics
              containerPort: 9090
          # No main listener: probes use the metrics port. Startup waits for PostgreSQL and migrations (5 min).
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 2
          # /livez ignores PostgreSQL: a database outage drops readiness, never restarts the pods.
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
          resources:
            # Parent (~20 MiB busy) plus 4 delivery sandbox children, ~210 MiB each at their cap.
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
