# TEST ONLY: ephemeral PostgreSQL for scripts/k8s-smoke.sh (emptyDir, fixed password).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  # Starts stopped: scripts/k8s-smoke.sh scales it up once gedour is waiting for it.
  replicas: 0
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: gedour
            - name: POSTGRES_USER
              value: gedour
            - name: POSTGRES_PASSWORD
              value: gedour
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gedour", "-d", "gedour"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
